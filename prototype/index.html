<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weft prototype</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --ink: #1c1c1e; --ink-2: #54545a; --ink-3: #8c8c92;
  --line: #e2dfd8; --accent: #2f6ae0; --accent-tint: #e6eefc; --late: #c8414f; --late-tint: #fbe8ea;
  --tl: 46%; --ts: 52%; --tint-l: 93%;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --ink: #ececee; --ink-2: #b0b0b6; --ink-3: #7c7c84;
    --line: #2f2f34; --accent: #6d9bff; --accent-tint: #1d2a44; --late: #ff6b78; --late-tint: #3a1d22;
    --tl: 64%; --ts: 50%; --tint-l: 20%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --ink: #ececee; --ink-2: #b0b0b6; --ink-3: #7c7c84;
  --line: #2f2f34; --accent: #6d9bff; --accent-tint: #1d2a44; --late: #ff6b78; --late-tint: #3a1d22;
  --tl: 64%; --ts: 50%; --tint-l: 20%;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* header */
.top { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
#capture { display: flex; gap: 6px; flex: 1 1 360px; min-width: 0; }
#capture input[type=text] { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
#capture input[type=date] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 150px; }
#capture button, .btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.btn.primary, #capture button { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 8px; }
.tabs { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 8px; color: var(--ink-2); }
.tabs button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

main { padding: 16px; transition: margin-right .2s; }
@media (min-width: 1100px) { body.panel-open main { margin-right: 400px; } }
.hint { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; max-width: 900px; }
.hint b { color: var(--ink); font-weight: 600; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 12px; white-space: nowrap;
  background: hsl(var(--h) 60% var(--tint-l)); color: hsl(var(--h) var(--ts) var(--tl)); border: 1px solid transparent; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.chip.sug { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
.chip.sug::before { background: var(--accent); }
.chip.loose { --h: 0; background: var(--surface-2); color: var(--ink-3); }
.chip.loose::before { background: var(--ink-3); }
.badge { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px dashed var(--accent); color: var(--accent); white-space: nowrap; }

/* Now */
.now { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 900px) { .now { grid-template-columns: minmax(0, 1fr) 300px; } }
.group { margin-bottom: 20px; }
.group h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.group.late h3 { color: var(--late); }
.group.today h3, .group.late h3 { font-size: 15px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.card { position: relative; display: grid; gap: 5px; padding: 10px 12px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--ink-3); }
.card.late { background: var(--late-tint); border-color: color-mix(in srgb, var(--late) 40%, transparent); }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .ctext { padding-right: 26px; }
.card .ctx { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .foot { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.card .when { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.card.late .when { color: var(--late); }
.card .done { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; font-size: 11px; line-height: 1; color: transparent; }
.card .done:hover { border-color: var(--ink); color: var(--ink); }
.card.rhythm { cursor: default; }
.side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 6px; }
.side p.sub { margin: 0 0 8px; color: var(--ink-3); font-size: 12px; }
.line-item { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 6px; }
.line-item:hover { border-color: var(--ink-3); }
.line-item .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--ink-3); }

/* History (lanes) */
.lanes { display: flex; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.lane-labels { position: relative; flex: 0 0 170px; border-right: 1px solid var(--line); background: var(--surface); z-index: 1; }
.lane-label { position: absolute; left: 0; right: 0; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
.lane-label:hover, .lane-label.sel { background: var(--surface-2); }
.lane-label .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; line-height: 1.2; }
.lane-label .nm i { flex: 0 0 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.lane-label .mt { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.lane-label.resolved { opacity: .55; }
.lane-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; }
@media (max-width: 640px) { .lane-labels { flex-basis: 112px; } .lane-label .mt { display: none; } }
svg text { fill: var(--ink-2); font-size: 11px; }
.ax { fill: var(--ink-3); font-size: 11px; }
.grid { stroke: var(--line); }
.stripe { fill: var(--surface-2); opacity: .45; }
.todayline { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; }
.todaytxt { fill: var(--ink); font-weight: 600; }
.tl { stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 3; stroke-linecap: round; fill: none; }
.tl.future { stroke-dasharray: 2 6; stroke-width: 2.5; }
.tl.resolved { opacity: .45; }
.dot { fill: hsl(var(--h) var(--ts) var(--tl)); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.dot.ask { fill: var(--surface); stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 2.5; }
.dot.ask.late { stroke: var(--late); fill: var(--late-tint); }
.dot.loose { fill: var(--ink-3); }
.dot.loose.ask { fill: var(--surface); stroke: var(--ink-3); }
.pill { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; cursor: pointer; }
.elink { stroke: var(--ink-2); stroke-width: 1.5; fill: none; opacity: .75; }
.sug { stroke: var(--accent); stroke-dasharray: 4 4; stroke-width: 1.5; fill: none; }
.sugdot { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 2 2; stroke-width: 1.5; }
.lbl { font-size: 11px; fill: var(--ink-2); pointer-events: none; }
.lbl.ask { fill: var(--ink); font-weight: 550; }
.dim { opacity: .18; transition: opacity .15s; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2; }
g.away { opacity: .3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin: 10px 2px 0; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.lg { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }

/* story (thread panel) */
.story { margin-top: 16px; }
.story h3 { margin: 0 0 4px; font-size: 16px; }
.story .sub { color: var(--ink-3); font-size: 12.5px; margin: 0 0 10px; }
.sline { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
.sline:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.sline .sd { font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.sline .st { display: grid; gap: 4px; }
.sline .sm { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }
.sline.reply .st > span:first-child { padding-left: 14px; position: relative; }
.sline.reply .st > span:first-child::after { content: "↳"; position: absolute; left: 0; color: var(--ink-3); }
.sline.sug .st > span:first-child { color: var(--ink-2); font-style: italic; }
.sline.ask .st > span:first-child::before { content: "○ "; color: var(--ink-3); }
.sline.ask.late .st > span:first-child::before { color: var(--late); }
.sline.done .st > span:first-child::before { content: "✓ "; color: var(--ink-3); }
.divider { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); padding: 10px 0 4px; border-top: 1.5px solid var(--ink); }

/* workspace: islands */
.loose-tray { border: 1.5px dashed color-mix(in srgb, var(--ink-3) 70%, transparent); background: color-mix(in srgb, var(--surface-2) 40%, transparent); border-radius: 18px; padding: 10px 12px 12px; margin-bottom: 18px; }
.tray-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.tray-h .ttl { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tray-h .tools { display: flex; gap: 10px; align-items: center; }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--ink-2); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.loose-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.away-list { margin: 0 0 10px; padding: 6px 10px; border-radius: 10px; background: var(--surface); font-size: 13px; }
.away-list div { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 3px 0; color: var(--ink-3); }
.islands { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); grid-auto-rows: 4px; column-gap: 16px; align-items: start; }
.island { margin-bottom: 16px; border-radius: 18px; padding: 11px 11px 12px;
  background: color-mix(in srgb, hsl(var(--h) 60% 50%) 7%, var(--surface)); border: 1px solid color-mix(in srgb, hsl(var(--h) 60% 50%) 16%, var(--surface)); }
.ih { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; cursor: grab; }
.ih .dot2 { flex: none; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.ih .nm { min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
.ih .ct { font-size: 11.5px; color: var(--ink-3); background: var(--surface); border-radius: 999px; padding: 0 7px; }
.ih .ctl { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.island:hover .ctl, .ih:focus-within .ctl { opacity: 1; }
@media (hover: none) { .ih .ctl { opacity: 1; } }
.ih .ctl button { border: 0; background: transparent; color: var(--ink-3); padding: 0 5px; font-size: 13px; border-radius: 6px; }
.ih .ctl button:hover { color: var(--ink); background: var(--surface); }
.ih input { flex: 1; min-width: 0; padding: 3px 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); font-weight: 600; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.wc, .wref { min-width: 0; }
.wc { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 12px; padding: 9px 11px 8px; cursor: grab; font-size: 13px; line-height: 1.38; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.wc:hover { border-color: var(--ink-3); }
.wc.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.twin { outline: 2px dashed var(--accent) !important; outline-offset: 1px; }
.dragsrc { opacity: .35; }
.wc .wt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.wc .upd { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 0 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wc .upd:hover { color: var(--ink); }
.wc .upd span { color: var(--ink-2); }
.wc .wask { font-size: 12.5px; margin-top: 4px; color: var(--ink); }
.wc .wask.late { color: var(--late); }
.chainlist { margin: 6px 0 2px 3px; border-left: 2px solid var(--line); padding-left: 9px; display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
.chainlist .cl { cursor: pointer; }
.chainlist .cl:hover { color: var(--ink); }
.chainlist .cl span { color: var(--ink-3); font-size: 11.5px; margin-right: 6px; }
.chainlist .cl.ask::before { content: "○ "; }
.chainlist .cl.done::before { content: "✓ "; color: var(--ink-3); }
.wc .wm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 5px; font-size: 11.5px; color: var(--ink-3); }
.wc.late .when { color: var(--late); }
.wc .also { color: hsl(var(--h) var(--ts) var(--tl)); }
.wc .also::before { content: "● "; font-size: 9px; }
.refs { margin-top: 10px; }
.refs-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 2px 5px; }
.wref { display: flex; gap: 7px; align-items: center; padding: 5px 9px; border-radius: 10px; border: 1px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); font-size: 12.5px; color: var(--ink-2); cursor: grab; }
.wref + .wref { margin-top: 5px; }
.wref:hover { color: var(--ink); border-color: var(--ink-3); }
.wref .arrow { color: var(--ink-3); }
.wref .rt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wref .in { font-size: 11.5px; color: hsl(var(--h) var(--ts) var(--tl)); white-space: nowrap; }
.empty { font-size: 12.5px; color: var(--ink-3); padding: 4px 2px; }
.more { display: block; margin-top: 6px; border: 0; background: transparent; color: var(--ink-3); font-size: 12px; padding: 2px; }
.sughere { margin-top: 10px; padding: 6px 8px; border: 1px dashed var(--accent); border-radius: 10px; font-size: 12px; color: var(--accent); display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.sughere div { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.sughere span { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sughere button { flex: none; }
.shelf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 2px 0 10px; }
.shelf-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-right: 4px; }
.shelf-pill { display: inline-flex; gap: 7px; align-items: center; border: 1px solid color-mix(in srgb, hsl(var(--h) 60% 50%) 25%, var(--surface)); background: color-mix(in srgb, hsl(var(--h) 60% 50%) 7%, var(--surface)); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.shelf-pill i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.shelf-pill small { color: var(--ink-3); }
.over { outline: 2px solid var(--accent) !important; outline-offset: 2px; }
.sugtarget { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent); }
#dock { position: fixed; z-index: 45; left: 50%; bottom: 66px; transform: translateX(-50%); display: none; gap: 10px; padding: 10px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); align-items: center; max-width: calc(100vw - 32px); }
body.dragging #dock { display: flex; }
#dock .dz { padding: 10px 16px; border: 1.5px dashed var(--ink-3); border-radius: 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
#dock .dh { font-size: 12px; color: var(--ink-3); max-width: 230px; }

/* panel */
#panel { position: fixed; z-index: 30; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: 14px 16px 24px;
  right: 0; top: 0; bottom: 0; width: 400px; max-width: 100vw; }
@media (max-width: 760px) { #panel { top: auto; left: 0; width: auto; height: 72vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; } }
#panel[hidden] { display: none; }
#panel .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
#panel .x { border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--ink-3); padding: 2px 6px; }
#panel textarea, #panel input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); resize: vertical; }
#panel textarea { min-height: 76px; }
#panel #compose { min-height: 54px; }
#panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 13px; color: var(--ink-2); }
#panel .mini { font-size: 12px; color: var(--ink-3); }
#panel .follows { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
#panel .follows a { color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
#panel .sec { margin-top: 16px; }
#panel .sec > b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 6px; font-weight: 600; }
#panel .conn { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
#panel .conn span.t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel .unl { border: 0; background: transparent; color: var(--ink-3); font-size: 16px; padding: 0 4px; }
#panel select, #panel input[type=date] { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
#panel .sugbox { border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 10px; background: var(--accent-tint); }
#panel .sugbox .conn { border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
#panel .danger { color: var(--late); border-color: color-mix(in srgb, var(--late) 40%, transparent); }
#panel .composer.focus textarea { border-color: var(--accent); }
.ct-row { padding: 5px 8px; border-left: 2px solid var(--line); cursor: pointer; font-size: 13px; }
.ct-row:hover { background: var(--surface-2); }
.ct-row.cur { border-left-color: var(--accent); background: var(--accent-tint); }
.ct-row span { color: var(--ink-3); font-size: 11.5px; margin-right: 6px; }
.ct-row.ask::before { content: "○ "; }
.ct-row.done::before { content: "✓ "; color: var(--ink-3); }
.ct-row.away { opacity: .45; }

/* switcher, tip, toast */
#switcher { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--ink); color: var(--bg); overflow-x: auto; }
#switcher .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; white-space: nowrap; }
#switcher button { border: 1px solid transparent; background: transparent; color: var(--bg); border-radius: 8px; padding: 4px 10px; white-space: nowrap; opacity: .75; }
#switcher button[aria-pressed=true] { opacity: 1; border-color: color-mix(in srgb, var(--bg) 50%, transparent); }
#switcher button small { opacity: .65; margin-left: 4px; }
#switcher .sp { flex: 1; }
@media (max-width: 760px) { #switcher button small { display: none; } }
#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 280px; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
#tip[hidden] { display: none; }
#tip small { display: block; opacity: .7; margin-top: 2px; }
#toast { position: fixed; z-index: 50; pointer-events: none; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); }
#toast[hidden] { display: none; }
body.dragging #toast { display: none; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<aside id="panel" hidden></aside>
<div id="dock"><div class="dz" data-drop="loose">Take off this group</div><div class="dz" data-drop="new">+ New group</div><div class="dz" data-drop="away">Put away</div><div class="dh" id="dock-hint"></div></div>
<nav id="switcher"></nav>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<script>
"use strict";
// ---------- time ----------
const DAY = 86400000;
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const T0 = startOfDay(Date.now());
const D = n => { const d = new Date(T0); d.setDate(d.getDate() + n); return d.getTime(); };
const dayIdx = ts => Math.round((startOfDay(ts) - T0) / DAY);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const md = ts => { const d = new Date(ts); return MON[d.getMonth()] + " " + d.getDate(); };
function fmtDay(ts) {
  const n = dayIdx(ts);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WD[new Date(ts).getDay()];
  return md(ts);
}
const toInput = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fromInput = v => { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };

// ---------- scenario ----------
// The six cases from docs/research/2026-11-08-data-shape-analysis.md. Round 3 adds chains:
// an entry may follow from one earlier entry ("what happened next"), and belongs to its chain's threads.
function seed() {
  const threads = [
    { id: "t:mum", name: "Mum's blood pressure", hue: 350 },
    { id: "t:sleep", name: "Sleep", hue: 245 },
    { id: "t:work", name: "Work stress", hue: 28 },
    { id: "t:teeth", name: "Teeth", hue: 188 },
    { id: "t:admin", name: "Admin & insurance", hue: 140 },
    { id: "t:home", name: "Home", hue: 70, rhythm: { text: "Water the plants", weekday: 0 } },
    { id: "t:car", name: "Replace the car", hue: 290, resolvedAt: D(-50) },
  ];
  const entries = [], links = [];
  const E = (id, text, at, o = {}) => {
    const eid = "e:" + id;
    const e = { id: eid, text, at: D(at), ask: o.ask != null ? D(o.ask) : null, doneAt: o.done != null ? D(o.done) : null };
    if (o.parent) e.parent = "e:" + o.parent;
    entries.push(e);
    (o.on || []).forEach(t => links.push({ a: eid, b: "t:" + t }));
    (o.sugOn || []).forEach(t => links.push({ a: eid, b: "t:" + t, s: true }));
    (o.sugTo || []).forEach(x => links.push({ a: eid, b: "e:" + x, s: true }));
  };
  // A parent's blood pressure: one chain from checkup to recheck, plus the insurance chain that lives in Admin.
  E("m1", "Mum's checkup: blood pressure 160/100. The doctor wants her to see a cardiologist.", -95, { on: ["mum"] });
  E("m1b", "Book the cardiology appointment", -95, { ask: -88, done: -88, parent: "m1" });
  E("m2", "Cardiology visit: new medication, one pill each morning. BP 150/95 there.", -67, { parent: "m1b" });
  E("m5", "Recheck with the cardiologist", -67, { ask: 24, parent: "m2" });
  E("m3", "Mum said she feels dizzy in the mornings.", -51, { sugOn: ["mum"] });
  E("m6", "Bought Mum a home BP monitor. Readings around 135/85.", -20, { on: ["mum"] });
  E("i1", "Insurance rejected the cardiology claim.", -30, { on: ["admin", "mum"] });
  E("i2", "Called the insurer: they need form B from the clinic.", -26, { parent: "i1" });
  E("i3", "Sent form B. Check the appeal before the 15th.", -12, { ask: 7, parent: "i2" });
  // The dentist note on three threads; the night guard was pulled out of it.
  E("s1", "Waking up tired even after eight hours.", -80, { on: ["sleep"] });
  E("w1", "Launch pushed again. Working late most nights.", -60, { on: ["work"] });
  E("s2", "No screens after 10pm for a week. Slightly better?", -45, { on: ["sleep"] });
  E("d1", "Dentist: I'm grinding my teeth. Recommends a night guard, asked if I'm stressed.", -25, { on: ["teeth", "sleep"], sugOn: ["work"] });
  E("d2", "Get the night guard fitted", -25, { ask: 3, parent: "d1" });
  E("w2", "Talked to my manager about workload. Check in again in a month.", -25, { ask: 5, on: ["work"] });
  E("s3", "Bad week. Awake at 4am twice, mind racing about the launch.", -8, { on: ["sleep", "work"] });
  E("a1", "Taxes: one bank statement missing. Request it from the bank.", -40, { ask: -2, on: ["admin"] });
  // The car decision: a single-story thread, kept as separate entries on purpose.
  E("c1", "Car needs a new transmission. Fix or replace?", -75, { on: ["car"] });
  E("c2", "Compared three models. Leaning toward the hybrid.", -66, { on: ["car"] });
  E("c3", "Test drive went well.", -58, { on: ["car"] });
  E("c4", "Bought the hybrid.", -50, { on: ["car"] });
  // The leak: a to-do that became a situation, as one chain.
  E("h1", "Call the plumber about the leak under the sink.", -33, { ask: -30, done: -30, on: ["home"] });
  E("h2", "Plumber came: the pipe needs replacing. Quote in two weeks.", -30, { parent: "h1" });
  E("h3", "Chase the plumber's quote", -30, { ask: 0, parent: "h2" });
  // Loose: the back pain that might become a thing, the good day, an idea.
  E("b1", "Lower back stiff after the long drive.", -66);
  E("b2", "Back again. Maybe the desk chair?", -50, { sugTo: ["b1"] });
  E("b3", "Couldn't sit through the movie, back pain again.", -37, { sugTo: ["b2"] });
  E("g1", "Hiked with a friend. Felt calm for the first time in weeks. Should do this more.", -18, { sugOn: ["work", "sleep"] });
  E("l1", "Idea: learn to bake bread on weekends.", -5);
  return { threads, entries, links, order: threads.map(t => t.id), collapsed: {}, expanded: {} };
}

// ---------- state ----------
const KEY = "weft-proto-v3";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.entries) S = seed();
S.order ||= S.threads.map(t => t.id); S.collapsed ||= {}; S.expanded ||= {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const VARIANTS = {
  stack: "A chain shows where it started, then its updates",
  latest: "A chain shows its latest state first",
};
const VK = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let variant = VK.includes(params.get("variant")) ? params.get("variant") : "stack";
let tab = ["now", "work", "history"].includes(params.get("tab")) ? params.get("tab") : "work";
let sel = null, editing = null, composeFor = null, showAway = false, drag = null;
const openChains = new Set();

// ---------- graph helpers ----------
const isT = id => id.startsWith("t:");
const other = (l, id) => l.a === id ? l.b : l.b === id ? l.a : null;
const linksOf = id => S.links.filter(l => l.a === id || l.b === id);
const findLink = (a, b) => S.links.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
const byId = id => isT(id) ? S.threads.find(t => t.id === id) : S.entries.find(e => e.id === id);
const isAway = e => !!e && e.awayAt != null;
const live = arr => arr.filter(e => !isAway(e));
const tname = t => t.name || "Untitled group";
// chains
const rootOf = e => { let r = e, n = 0; while (r.parent && byId(r.parent) && n++ < 100) r = byId(r.parent); return r; };
const repliesOf = e => S.entries.filter(x => x.parent === e.id).sort((a, b) => a.at - b.at);
function chainOf(root) { const out = [root]; for (let i = 0; i < out.length; i++) out.push(...repliesOf(out[i])); return out; }
// membership lives on a chain's first entry; every update inherits it
const directThreads = (eid, sug = false) => linksOf(eid).filter(l => !!l.s === sug).map(l => other(l, eid)).filter(isT);
const threadsOf = (eid, sug = false) => { const e = byId(eid); if (!e) return []; return directThreads(sug ? eid : rootOf(e).id, sug); };
const rootsOf = (tid, sug = false) => linksOf(tid).filter(l => !!l.s === sug).map(l => byId(other(l, tid))).filter(Boolean);
const entriesOf = (tid, sug = false) => sug ? rootsOf(tid, true) : rootsOf(tid).flatMap(chainOf);
const homeOf = root => directThreads(root.id)[0];
const isOpenAsk = e => e.ask != null && e.doneAt == null;
const isLate = e => isOpenAsk(e) && dayIdx(e.ask) < 0;
const posTime = e => isOpenAsk(e) ? e.ask : (e.doneAt != null ? e.doneAt : e.at);
const actTime = e => e.doneAt != null ? e.doneAt : e.at;
const nameOf = id => { const n = byId(id); return !n ? "?" : isT(id) ? tname(n) : n.text; };
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const h = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hueOf = tid => (byId(tid) || {}).hue ?? 0;
const chip = (tid, sug) => `<span class="chip${sug ? " sug" : ""}" style="--h:${hueOf(tid)}">${h(tname(byId(tid)))}</span>`;
const lastActivity = t => Math.max(0, ...entriesOf(t.id).map(actTime));
function orderedThreads() {
  const ids = S.order.filter(id => byId(id));
  S.threads.forEach(t => { if (!ids.includes(t.id)) ids.push(t.id); });
  S.order = ids; return ids.map(byId);
}
function chainInfo(root) {
  const all = live(chainOf(root));
  const updates = all.slice(1).sort((a, b) => a.at - b.at);
  const asks = all.filter(isOpenAsk).sort((a, b) => a.ask - b.ask);
  const latest = all.reduce((a, b) => actTime(b) >= actTime(a) ? b : a, all[0] || root);
  return { all, updates, ask: asks[0] || null, late: asks.some(isLate), latest, lastTs: Math.max(...all.map(actTime), root.at) };
}

// ---------- suggestions ----------
const STOP = new Set("the and for with that this from have has had was were are will just still some very really into over two one three about after before felt feel today tomorrow maybe need needs want should more again week weeks time first went than then them they she her his him our your you can could would told said says get got make made also back".split(" "));
const SYN = {};
Object.entries({
  back: "back spine posture chair sit sitting sat lower stiff",
  sleep: "sleep slept tired awake insomnia 4am night nights rest bed screens",
  work: "work launch workload manager deadline stress stressed calm office job",
  mum: "mum mom mother bp pressure dizzy dizziness cardiology cardiologist medication monitor",
  teeth: "teeth tooth dentist grinding guard jaw",
  admin: "insurance insurer claim tax taxes bank appeal statement form",
  home: "plumber leak pipe sink plants house kitchen quote",
}).forEach(([k, words]) => words.split(" ").forEach(w => SYN[w] = "#" + k));
function toks(text) {
  const out = new Set();
  text.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).forEach(w => {
    if (SYN[w]) { out.add(SYN[w]); return; }
    if (w.length < 3 || STOP.has(w)) return;
    const st = w.length > 5 ? w.replace(/(ing|ed|es|s)$/, "") : w;
    out.add(SYN[st] || st);
  });
  return out;
}
const overlap = (a, b) => { let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return n; };
function suggest(e) {
  const tk = toks(e.text); if (!tk.size) return [];
  const scored = [];
  S.threads.filter(t => !t.resolvedAt).forEach(t => {
    const s = overlap(tk, toks(t.name + " " + entriesOf(t.id).map(x => x.text).join(" ")));
    if (s > 0) scored.push({ id: t.id, s: s + 0.5 });
  });
  live(S.entries).filter(x => x.id !== e.id && !x.parent && !threadsOf(x.id).length).forEach(x => {
    const s = overlap(tk, toks(x.text)); if (s > 0) scored.push({ id: x.id, s });
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, 3).map(x => x.id);
}
function sugFor(e) {
  const s = new Set(threadsOf(e.id, true));
  suggest(e).filter(isT).forEach(t => s.add(t));
  threadsOf(e.id).forEach(t => s.delete(t));
  return s;
}

// ---------- mutations ----------
function addEntry(text, ask, parent) {
  const e = { id: "e:" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text, at: Date.now(), ask, doneAt: null };
  if (parent) e.parent = parent;
  S.entries.push(e);
  const sugs = parent ? [] : suggest(e);
  sugs.forEach(id => S.links.push({ a: e.id, b: id, s: true }));
  return { e, sugs };
}
function link(a, b) { const l = findLink(a, b); if (l) delete l.s; else S.links.push({ a, b }); }
function unlink(a, b) { S.links = S.links.filter(l => !((l.a === a && l.b === b) || (l.a === b && l.b === a))); }
function newThread(name) {
  const used = S.threads.map(t => t.hue);
  const hues = [210, 320, 100, 260, 10, 160, 50, 230];
  const t = { id: "t:" + Date.now().toString(36), name, hue: hues.find(x => !used.includes(x)) ?? Math.floor(Math.random() * 360) };
  S.threads.push(t); S.order.unshift(t.id); S.collapsed[t.id] = false;
  return t;
}
// Accepting a suggestion: entry→thread links them; entry↔entry groups them.
function accept(a, b) {
  if (isT(a) || isT(b)) { link(a, b); return `On ${tname(byId(isT(a) ? a : b))}`; }
  unlink(a, b);
  const ra = rootOf(byId(a)).id, rb = rootOf(byId(b)).id, ta = threadsOf(ra), tb = threadsOf(rb);
  if (ta.length && !tb.length) { link(rb, ta[0]); return `On ${tname(byId(ta[0]))}`; }
  if (tb.length && !ta.length) { link(ra, tb[0]); return `On ${tname(byId(tb[0]))}`; }
  const t = newThread(""); link(ra, t.id); link(rb, t.id); editing = t.id;
  return "New group with both. Give it a name.";
}
// One rule for every drop: a move, or with ⌥ an "also". eid is always a chain's first entry.
function dropEntry(eid, from, target, alt) {
  const e = byId(eid); if (!e || target === eid) return;
  const fromT = from && isT(from) ? from : null;
  if (target === "away") { e.awayAt = T0; return "Put away, with its updates."; }
  if (target === "loose") { if (!fromT) return; unlink(eid, fromT); return threadsOf(eid).length ? `Taken off ${tname(byId(fromT))}` : "Loose again"; }
  if (target === "new" || !isT(target)) {
    const t = newThread("");
    if (fromT && !alt) unlink(eid, fromT);
    link(eid, t.id);
    if (target !== "new") link(rootOf(byId(target)).id, t.id);
    editing = t.id;
    return "New group. Give it a name.";
  }
  if (target === fromT) return;
  if (fromT && !alt) unlink(eid, fromT);
  link(eid, target);
  return alt && fromT ? `Also on ${tname(byId(target))}` : `On ${tname(byId(target))}`;
}
function deleteEntry(id) {
  const e = byId(id), kids = repliesOf(e);
  if (e.parent) kids.forEach(k => k.parent = e.parent);
  else kids.forEach(k => { delete k.parent; directThreads(id).forEach(t => S.links.push({ a: k.id, b: t })); });
  S.entries = S.entries.filter(x => x.id !== id);
  S.links = S.links.filter(l => l.a !== id && l.b !== id);
}

// ---------- render ----------
const $ = id => document.getElementById(id);
function render() {
  if (editing && tab !== "work") { tab = "work"; setUrl(); }
  renderTop(); renderMain(); renderPanel(); renderSwitcher(); save();
  const ri = document.querySelector("[data-rename]");
  if (ri && document.activeElement !== ri) { ri.focus(); ri.select(); }
  else if (composeFor && $("compose") && document.activeElement !== $("compose")) $("compose").focus();
}
function setUrl() {
  const p = new URLSearchParams(); p.set("tab", tab); p.set("variant", variant);
  try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {}
}
function renderTop() {
  const ae = document.activeElement && document.activeElement.id;
  const keep = $("cap-text") ? $("cap-text").value : "";
  $("top").innerHTML = `
    <div class="brand">weft <small>prototype</small></div>
    <form id="capture" autocomplete="off">
      <input type="text" id="cap-text" placeholder="What's happening? Enter drops it at now" value="${h(keep)}">
      <input type="date" id="cap-date" title="Bring it back on (optional)">
      <button type="submit">Drop</button>
    </form>
    <div class="tabs" role="group">
      <button data-tab="now" aria-pressed="${tab === "now"}">Now</button>
      <button data-tab="work" aria-pressed="${tab === "work"}">Workspace</button>
      <button data-tab="history" aria-pressed="${tab === "history"}">History</button>
    </div>`;
  if (ae === "cap-text") $("cap-text").focus();
}
function renderMain() {
  const m = $("main");
  document.body.classList.toggle("panel-open", !!sel);
  if (tab === "now") return renderNow(m);
  if (tab === "history") return renderLanes(m);
  renderIslands(m);
}

// ---------- Now ----------
function nowItems() {
  const items = live(S.entries).filter(e => isOpenAsk(e) && !isAway(rootOf(e))).map(e => ({ e, ts: e.ask }));
  S.threads.filter(t => t.rhythm && !t.resolvedAt).forEach(t => items.push({ rhythm: t, ts: D((t.rhythm.weekday - new Date(T0).getDay() + 7) % 7) }));
  return items.sort((a, b) => a.ts - b.ts);
}
function groupOf(ts) {
  const n = dayIdx(ts);
  if (n < 0) return "Late"; if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n < 7) return "This week"; return "Later";
}
function nowCard(e) {
  const root = rootOf(e), ts = threadsOf(e.id), sg = threadsOf(root.id, true);
  return `<div class="card${isLate(e) ? " late" : ""}${sel === e.id ? " sel" : ""}" data-open="${e.id}" tabindex="0">
    <span class="ctext">${h(e.text)}</span>
    ${root !== e ? `<span class="ctx">↳ ${h(root.text)}</span>` : ""}
    <span class="foot">${ts.map(t => chip(t)).join("")}${sg.map(t => chip(t, true)).join("")}${!ts.length && !sg.length ? `<span class="chip loose">Loose</span>` : ""}
      <span class="when">${fmtDay(e.ask)}</span></span>
    <button class="done" data-done="${e.id}" title="Handled: then say what happened">✓</button>
  </div>`;
}
function renderNow(m) {
  const items = nowItems(), groups = {};
  items.forEach(it => (groups[groupOf(it.ts)] ||= []).push(it));
  const loose = live(S.entries).filter(e => !e.parent && !threadsOf(e.id).length && !isOpenAsk(e)).sort((a, b) => b.at - a.at);
  const quiet = S.threads.filter(t => !t.resolvedAt && !live(entriesOf(t.id)).some(isOpenAsk));
  m.innerHTML = `<p class="hint"><b>Now</b>: what is asking, from bring-back dates. An update shows the chain it belongs to (↳). Handling something asks what happened, and the answer goes on the same chain.</p>
  <div class="now"><div>
    ${["Late", "Today", "Tomorrow", "This week", "Later"].filter(g => groups[g]).map(g => `<section class="group ${g.toLowerCase().replace(" ", "")}"><h3>${g}<span>${groups[g].length}</span></h3><div class="cards">
      ${groups[g].map(it => it.e ? nowCard(it.e) : `<div class="card rhythm"><span class="ctext">↻ ${h(it.rhythm.rhythm.text)}</span><span class="foot">${chip(it.rhythm.id)}<span class="when">${fmtDay(it.ts)} · every ${WD[it.rhythm.rhythm.weekday]}</span></span></div>`).join("")}
    </div></section>`).join("")}
  </div>
  <div class="side">
    <h3>Loose · ${loose.length}</h3>
    <p class="sub">Captured, not in a group. Fine as they are.</p>
    ${loose.map(e => { const n = linksOf(e.id).filter(l => l.s).length; return `<button class="line-item" data-open="${e.id}">${h(trunc(e.text, 80))}<span class="meta">${md(e.at)}${n ? `<span class="badge">${n} suggested</span>` : ""}</span></button>`; }).join("") || `<p class="sub">Nothing loose.</p>`}
    <h3 style="margin-top:18px">Quiet threads · ${quiet.length}</h3>
    <p class="sub">Open, nothing asking.</p>
    ${quiet.map(t => `<button class="line-item" data-open="${t.id}">${chip(t.id)}<span class="meta">last ${md(lastActivity(t) || T0)}</span></button>`).join("")}
  </div></div>`;
}

// ---------- Workspace: islands ----------
const isQuiet = t => !live(entriesOf(t.id)).some(isOpenAsk) && dayIdx(lastActivity(t)) < -21;
const isCollapsed = t => S.collapsed[t.id] ?? (!!t.resolvedAt || isQuiet(t));
function chainSort(a, b) {
  const A = chainInfo(a), B = chainInfo(b);
  if (A.ask && B.ask) return A.ask.ask - B.ask.ask;
  if (A.ask) return -1; if (B.ask) return 1;
  return B.lastTs - A.lastTs;
}
function chainCard(root, from) {
  const c = chainInfo(root), others = threadsOf(root.id).filter(t => t !== from);
  const sg = linksOf(root.id).filter(l => l.s).length, n = c.updates.length;
  const updWord = `${n} update${n > 1 ? "s" : ""}`;
  const open = openChains.has(root.id);
  let head, sub = "";
  if (variant === "latest" && n) {
    const cur = c.ask || c.latest;
    head = `${cur === c.ask ? "○ " : ""}${h(cur.text)}`;
    sub = `<button class="upd" data-act="chain" data-id="${root.id}">${open ? "▾" : "▸"} from <span>${h(root.text)}</span> · ${updWord}</button>`;
  } else {

      : e.doneAt ? `Handled ${md(e.doneAt)}, kept as a record <button class="btn small ghost" data-act="unhandle">Undo</button>`
      : `Bring back on <input type="date" data-act="ask" value="">`}</div>
    <div class="sec"><b>${asking ? "What happened?" : "What happened next?"}</b><div class="composer${asking ? " focus" : ""}">
      <textarea id="compose" placeholder="${asking ? "Say what happened, or leave it empty" : "Add an update to this chain"}"></textarea>
      <div class="row"><input type="date" id="compose-date" title="Bring it back on (optional)"><button class="btn small primary" data-act="reply">${asking ? "Save" : "Add update"}</button>${asking ? `<button class="btn small ghost" data-act="skipCompose">Nothing to add</button>` : ""}</div></div></div>
    ${chain.length > 1 ? `<div class="sec"><b>Chain · ${chain.length}</b>${chainTree(root, e.id)}</div>` : ""}
    ${sgT.length || sgE.length ? `<div class="sec"><b>Suggested</b><div class="sugbox">
      ${sgT.map(id => `<div class="conn"><span class="t">${chip(id, true)}</span><span><button class="btn small" data-accept="${root.id}|${id}">Accept</button> <button class="btn small ghost" data-dismiss="${root.id}|${id}">Dismiss</button></span></div>`).join("")}
      ${sgE.map(id => `<div class="conn"><span class="t">Group with: ${h(trunc(nameOf(id), 40))}</span><span><button class="btn small" data-accept="${root.id}|${id}">Accept</button> <button class="btn small ghost" data-dismiss="${root.id}|${id}">Dismiss</button></span></div>`).join("")}
    </div></div>` : ""}
    <div class="sec"><b>${e.parent ? "Threads (from where the chain started)" : "Threads"}</b>
      ${acc.map(t => `<div class="conn"><span class="t">${chip(t)}${t === homeOf(root) && acc.length > 1 ? ` <span class="mini">shown here in full</span>` : ""}</span><button class="unl" data-unlink="${root.id}|${t}" title="Take off this thread">×</button></div>`).join("") || `<p style="margin:0 0 6px;color:var(--ink-3)">Loose. That's fine.</p>`}
      <select data-act="addThread"><option value="">+ Put on a thread…</option>${S.threads.filter(t => !acc.includes(t.id)).map(t => `<option value="${t.id}">${h(tname(t))}</option>`).join("")}<option value="__new">New group…</option></select>
    </div>
    <div class="sec" style="display:flex;gap:8px">${isAway(e) ? `<button class="btn small" data-act="bringBack" data-id="${e.id}">Bring back</button>` : `<button class="btn small" data-act="putAway">Put away</button>`}<button class="btn small danger" data-act="delete">Delete</button></div>`;
}

// ---------- switcher, tip, toast ----------
function renderSwitcher() {
  $("switcher").innerHTML = `<span class="lab">Chain cards</span>${VK.map(k => `<button data-variant="${k}" aria-pressed="${variant === k}">${k}<small>${VARIANTS[k]}</small></button>`).join("")}<span class="sp"></span><button data-act="reset" title="Restore the scenario">Reset</button>`;
}
function showTip(text, ev) {
  const t = $("tip");
  if (!text) { t.hidden = true; return; }
  const [a, b] = text.split("|");
  t.innerHTML = h(a) + (b ? `<small>${h(b)}</small>` : "");
  t.hidden = false;
  const x = Math.min(ev.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - t.offsetHeight - 60);
  t.style.left = x + "px"; t.style.top = y + "px";
}
let toastT;
function toast(msg) { if (!msg) return; const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

// ---------- events ----------
document.addEventListener("mousemove", ev => {
  const el = ev.target.closest && ev.target.closest("[data-tip]");
  showTip(el ? el.getAttribute("data-tip") : null, ev);
});
document.addEventListener("mouseover", ev => {
  document.querySelectorAll(".twin").forEach(x => x.classList.remove("twin"));
  const c = ev.target.closest && ev.target.closest("[data-eid]"); if (!c || drag) return;
  const all = document.querySelectorAll(`[data-eid="${c.dataset.eid}"]`);
  if (all.length > 1) all.forEach(x => x !== c && x.classList.add("twin"));
});
document.addEventListener("dragstart", ev => {
  const c = ev.target.closest && ev.target.closest("[data-drag],[data-dragthread]"); if (!c) return;
  if (c.dataset.drag) {
    drag = { kind: "entry", id: c.dataset.drag, from: c.dataset.from };
    c.classList.add("dragsrc");
    sugFor(byId(drag.id)).forEach(t => document.querySelectorAll(`[data-drop="${t}"]`).forEach(x => x.classList.add("sugtarget")));
    const fromT = isT(drag.from) ? byId(drag.from) : null;
    $("dock-hint").textContent = fromT ? `Hold ⌥ while dropping to also keep it in ${tname(fromT)}.` : "Drop on a group, or on another loose card to start one.";
    $("dock").querySelector('[data-drop="loose"]').style.display = fromT ? "" : "none";
    document.body.classList.add("dragging");
  } else drag = { kind: "thread", id: c.dataset.dragthread };
  ev.dataTransfer.effectAllowed = "copyMove";
  try { ev.dataTransfer.setData("text/plain", drag.id); } catch (e) {}
});
document.addEventListener("dragover", ev => {
  if (!drag) return;
  const t = dropTarget(ev.target);
  document.querySelectorAll(".over").forEach(x => x !== t && x.classList.remove("over"));
  if (!t) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = ev.altKey ? "copy" : "move";
  t.classList.add("over");
});
document.addEventListener("drop", ev => {
  if (!drag) return;
  const t = dropTarget(ev.target); if (!t) return;
  ev.preventDefault();
  if (drag.kind === "thread") {
    const target = t.dataset.island;
    if (target !== drag.id) { S.order = S.order.filter(x => x !== drag.id); S.order.splice(S.order.indexOf(target), 0, drag.id); }
    drag = null; document.body.classList.remove("dragging"); return render();
  }
  const msg = dropEntry(drag.id, drag.from, t.dataset.drop, ev.altKey);
  drag = null; document.body.classList.remove("dragging"); render(); toast(msg);
});
document.addEventListener("dragend", () => { drag = null; document.body.classList.remove("dragging"); document.querySelectorAll(".over,.sugtarget,.dragsrc").forEach(x => x.classList.remove("over", "sugtarget", "dragsrc")); });
document.addEventListener("focusout", ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.rename) return;
  const t = byId(el.dataset.rename); if (t) t.name = el.value.trim() || "Untitled group";
  editing = null; render();
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "capture") return;
  ev.preventDefault();
  const text = $("cap-text").value.trim(); if (!text) return;
  const { e, sugs } = addEntry(text, fromInput($("cap-date").value));
  $("cap-text").value = "";
  sel = e.id;
  render();
  toast(sugs.length ? `Dropped at now. ${sugs.length} suggestion${sugs.length > 1 ? "s" : ""}.` : "Dropped at now. Loose, no suggestions.");
});
function handle(id) { const e = byId(id); e.doneAt = T0; sel = id; composeFor = id; render(); }
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-rename]")) return;
  const el = ev.target.closest("[data-act],[data-done],[data-accept],[data-dismiss],[data-unlink],[data-variant],[data-tab],[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.variant) { variant = d.variant; setUrl(); return render(); }
  if (d.tab) { tab = d.tab; setUrl(); return render(); }
  if (d.done) return handle(d.done);
  if (d.accept) { const [a, b] = d.accept.split("|"); const msg = accept(a, b); render(); return toast(msg); }
  if (d.dismiss) { const [a, b] = d.dismiss.split("|"); unlink(a, b); return render(); }
  if (d.unlink) { const [a, b] = d.unlink.split("|"); unlink(a, b); return render(); }
  if (d.act) {
    const e = sel && byId(sel), target = d.id ? byId(d.id) : e;
    switch (d.act) {
      case "close": sel = null; composeFor = null; return render();
      case "reset": if (confirm("Restore the original scenario? Your changes in the prototype are lost.")) { S = seed(); sel = null; editing = null; composeFor = null; openChains.clear(); laneScroll = null; render(); } return;
      case "handle": return handle(e.id);
      case "unhandle": e.doneAt = null; composeFor = null; return render();
      case "clearAsk": e.ask = null; e.doneAt = null; return render();
      case "resolve": target.resolvedAt = T0; S.collapsed[target.id] = true; render(); return toast(`Resolved. ${tname(target)} is on the shelf.`);
      case "reopen": delete target.resolvedAt; S.collapsed[target.id] = false; return render();
      case "rename": editing = d.id; return render();
      case "collapse": S.collapsed[d.id] = !isCollapsed(target); return render();
      case "expand": S.expanded[d.id] = !S.expanded[d.id]; return render();
      case "chain": openChains.has(d.id) ? openChains.delete(d.id) : openChains.add(d.id); return render();
      case "toggleAway": showAway = !showAway; return render();
      case "putAway": e.awayAt = T0; sel = null; render(); return toast("Put away. Find it under “Show put away”.");
      case "bringBack": delete target.awayAt; return render();
      case "delete": if (confirm("Delete this entry? Its updates stay, attached to what it followed from.")) { deleteEntry(sel); sel = null; composeFor = null; render(); } return;
      case "skipCompose": composeFor = null; return render();
      case "reply": {
        const text = $("compose").value.trim(), ask = fromInput($("compose-date").value);
        if (!text && !ask) { composeFor = null; return render(); }
        const { e: r } = addEntry(text || "Follow up", ask, sel);
        composeFor = null; sel = r.id; openChains.add(rootOf(r).id);
        render(); return toast("Added to the chain");
      }
      case "split": {
        const ta = $("ptext"), piece = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
        if (!piece) return toast("Select part of the text first");
        const { e: r } = addEntry(piece, null, sel);
        sel = r.id; openChains.add(rootOf(r).id);
        render(); return toast("Pulled out as its own update. Give it a date if it should come back.");
      }
    }
    return;
  }
  if (d.open) { sel = d.open; composeFor = null; return render(); }
});
document.addEventListener("change", ev => {
  const el = ev.target, act = el.dataset && el.dataset.act; if (!act || !sel) return;
  const e = byId(sel);
  if (act === "ask") { e.ask = fromInput(el.value); e.doneAt = null; return render(); }
  if (act === "addThread" && el.value) {
    const root = rootOf(e).id;
    if (el.value === "__new") { const t = newThread(""); link(root, t.id); editing = t.id; tab = "work"; setUrl(); return render(); }
    link(root, el.value); return render();
  }
  if (act === "merge" && el.value) {
    const from = sel, into = el.value, roots = rootsOf(from);
    roots.forEach(r => link(r.id, into));
    S.links = S.links.filter(l => l.a !== from && l.b !== from);
    S.threads = S.threads.filter(t => t.id !== from); S.order = S.order.filter(id => id !== from);
    sel = into; render(); return toast(`Merged ${roots.length} into ${tname(byId(into))}`);
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, act = el.dataset && el.dataset.act; if (!sel) return;
  if (act === "text") { byId(sel).text = el.value; renderMain(); save(); }
  if (act === "tname") { byId(sel).name = el.value; renderMain(); save(); }
});
document.addEventListener("keydown", ev => {
  const a = document.activeElement, typing = /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (a.dataset && a.dataset.rename && ev.key === "Enter") { a.blur(); return; }
  if (a.id === "compose" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { document.querySelector('[data-act="reply"]').click(); return; }
  if (ev.key === "Escape") { if (typing) a.blur(); sel = null; composeFor = null; return render(); }
  if (typing) return;
  if (ev.key === "[" || ev.key === "]") { const i = VK.indexOf(variant); variant = VK[(i + (ev.key === "]" ? 1 : VK.length - 1)) % VK.length]; setUrl(); return render(); }
  if (ev.key === "Enter" && a.dataset && a.dataset.open) a.click();
});
addEventListener("resize", () => { if (tab === "work") masonry(); });

render();
</script>
</body>
</html>
