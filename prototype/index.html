<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vita-next prototype</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --ink: #1c1c1e; --ink-2: #54545a; --ink-3: #8c8c92;
  --line: #e2dfd8; --accent: #2f6ae0; --accent-tint: #e6eefc; --late: #c8414f; --late-tint: #fbe8ea;
  --paper: #fffdf6; --tl: 46%; --ts: 52%; --tint-l: 93%;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --ink: #ececee; --ink-2: #b0b0b6; --ink-3: #7c7c84;
    --line: #2f2f34; --accent: #6d9bff; --accent-tint: #1d2a44; --late: #ff6b78; --late-tint: #3a1d22;
    --paper: #222226; --tl: 64%; --ts: 50%; --tint-l: 20%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d20; --surface-2: #26262a; --ink: #ececee; --ink-2: #b0b0b6; --ink-3: #7c7c84;
  --line: #2f2f34; --accent: #6d9bff; --accent-tint: #1d2a44; --late: #ff6b78; --late-tint: #3a1d22;
  --paper: #222226; --tl: 64%; --ts: 50%; --tint-l: 20%;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* header */
.top { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
#capture { display: flex; gap: 6px; flex: 1 1 360px; min-width: 0; }
#capture input[type=text] { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
#capture input[type=date] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 150px; }
#capture button, .btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.btn.primary, #capture button { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 8px; }
.tabs { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 8px; color: var(--ink-2); }
.tabs button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.today-title { color: var(--ink-2); }

main { padding: 16px; transition: margin-right .2s; }
@media (min-width: 1100px) { body.panel-open main { margin-right: 400px; } }
.hint { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; max-width: 900px; }
.hint b { color: var(--ink); font-weight: 600; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 12px; white-space: nowrap;
  background: hsl(var(--h) 60% var(--tint-l)); color: hsl(var(--h) var(--ts) var(--tl)); border: 1px solid transparent; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.chip.sug { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
.chip.sug::before { background: var(--accent); }
.chip.loose { --h: 0; background: var(--surface-2); color: var(--ink-3); }
.chip.loose::before { background: var(--ink-3); }

/* Now */
.now { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 900px) { .now { grid-template-columns: minmax(0, 1fr) 300px; } }
.group { margin-bottom: 20px; }
.group h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.group.late h3 { color: var(--late); }
.group.today h3, .group.late h3 { font-size: 15px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.card { position: relative; display: grid; gap: 6px; padding: 10px 12px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--ink-3); }
.card.late { background: var(--late-tint); border-color: color-mix(in srgb, var(--late) 40%, transparent); }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .ctext { padding-right: 26px; }
.card .foot { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.card .when { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.card.late .when { color: var(--late); }
.card .done { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; font-size: 11px; line-height: 1; color: transparent; }
.card .done:hover { border-color: var(--ink); color: var(--ink); }
.card.rhythm { cursor: default; }
.side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 6px; }
.side p.sub { margin: 0 0 8px; color: var(--ink-3); font-size: 12px; }
.line-item { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 6px; }
.line-item:hover { border-color: var(--ink-3); }
.line-item .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--ink-3); }
.badge { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px dashed var(--accent); color: var(--accent); }

/* lanes */
.lanes { display: flex; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.lane-labels { position: relative; flex: 0 0 170px; border-right: 1px solid var(--line); background: var(--surface); z-index: 1; }
.lane-label { position: absolute; left: 0; right: 0; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
.lane-label:hover, .lane-label.sel { background: var(--surface-2); }
.lane-label .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; line-height: 1.2; }
.lane-label .nm i { flex: 0 0 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) var(--ts) var(--tl)); }
.lane-label .mt { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.lane-label.resolved { opacity: .55; }
.lane-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; }
@media (max-width: 640px) { .lane-labels { flex-basis: 112px; } .lane-label .mt { display: none; } }
svg text { fill: var(--ink-2); font-size: 11px; }
.ax { fill: var(--ink-3); font-size: 11px; }
.grid { stroke: var(--line); }
.stripe { fill: var(--surface-2); opacity: .45; }
.todayline { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; }
.todaytxt { fill: var(--ink); font-weight: 600; }
.tl { stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 3; stroke-linecap: round; fill: none; }
.tl.future { stroke-dasharray: 2 6; stroke-width: 2.5; }
.tl.resolved { opacity: .45; }
.dot { fill: hsl(var(--h) var(--ts) var(--tl)); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.dot.ask { fill: var(--surface); stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 2.5; }
.dot.ask.late { stroke: var(--late); fill: var(--late-tint); }
.dot.loose { fill: var(--ink-3); }
.dot.loose.ask { fill: var(--surface); stroke: var(--ink-3); }
.pill { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; cursor: pointer; }
.elink { stroke: var(--ink-3); stroke-width: 1.5; fill: none; opacity: .7; }
.sug { stroke: var(--accent); stroke-dasharray: 4 4; stroke-width: 1.5; fill: none; }
.sugdot { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 2 2; stroke-width: 1.5; }
.lbl { font-size: 11px; fill: var(--ink-2); pointer-events: none; }
.lbl.ask { fill: var(--ink); font-weight: 550; }
.dim { opacity: .18; transition: opacity .15s; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin: 10px 2px 0; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.lg { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }

/* canvas */
.canvas-wrap { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; overflow: hidden; height: calc(100vh - 210px); min-height: 420px; }
.canvas-wrap svg { width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
.canvas-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.canvas-tools .tip { font-size: 12px; color: var(--ink-3); background: var(--surface); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); }
.cnode { cursor: pointer; }
.cnode .cardbg { fill: var(--paper); stroke: var(--line); stroke-width: 1.2; }
.cnode.loose .cardbg { fill: var(--paper); stroke: var(--ink-3); stroke-dasharray: 3 3; }
.cnode .stripe2 { fill: hsl(var(--h) var(--ts) var(--tl)); }
.cnode .ctxt { fill: var(--ink); font-size: 12px; }
.cnode .cwhen { fill: var(--ink-3); font-size: 11px; }
.cnode .cwhen.late { fill: var(--late); }
.cnode .tbg { fill: hsl(var(--h) 60% var(--tint-l)); stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 2; }
.cnode .ttxt { fill: hsl(var(--h) var(--ts) var(--tl)); font-weight: 650; font-size: 13px; }
.cnode.selected .cardbg, .cnode.selected .tbg { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: none; }
.cedge { stroke: var(--ink-3); stroke-width: 1.4; opacity: .55; }

/* focus */
.focus { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .focus { grid-template-columns: 220px minmax(0, 1fr); } }
.picker h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.picker button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: 8px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker button:hover { background: var(--surface-2); }
.picker button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.radial { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.radial svg { width: 100%; height: auto; max-height: 480px; display: block; }
.rnode { cursor: pointer; }
.rnode circle.e { fill: hsl(var(--h) var(--ts) var(--tl)); stroke: var(--surface); stroke-width: 2; }
.rnode circle.e.loose { fill: var(--ink-3); }
.rnode circle.e.ask { fill: var(--surface); stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 2.5; }
.rnode rect { fill: hsl(var(--h) 60% var(--tint-l)); stroke: hsl(var(--h) var(--ts) var(--tl)); stroke-width: 2; }
.rnode .rt { fill: hsl(var(--h) var(--ts) var(--tl)); font-weight: 650; font-size: 12px; }
.rnode.far { opacity: .45; }
.redge { stroke: var(--ink-3); stroke-width: 1.3; opacity: .5; }

/* story */
.story { margin-top: 16px; }
.story h3 { margin: 0 0 4px; font-size: 16px; }
.story .sub { color: var(--ink-3); font-size: 12.5px; margin: 0 0 10px; }
.sline { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
.sline:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.sline .sd { font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.sline .st { display: grid; gap: 4px; }
.sline .sm { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }
.sline.sug .st > span:first-child { color: var(--ink-2); font-style: italic; }
.sline.ask .st > span:first-child::before { content: "○ "; color: var(--ink-3); }
.sline.ask.late .st > span:first-child::before { color: var(--late); }
.sline.done .st > span:first-child::before { content: "✓ "; color: var(--ink-3); }
.divider { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); padding: 10px 0 4px; border-top: 1.5px solid var(--ink); }

/* current (Vita OS today) */
.cur { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .cur { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
.cur .card { cursor: default; }
.cur .tnm { color: var(--ink-3); font-size: 12.5px; }
.dog { font-size: 11px; color: var(--ink-3); }
.pane { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
.pane h2 { margin: 2px 0 10px; font-size: 18px; }
.pane h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.pane ul { margin: 0; padding-left: 18px; }
.pane li { margin: 3px 0; }
.pane li small { color: var(--ink-3); }
.tpick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tpick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.tpick button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.missing { margin-top: 16px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--accent-tint); }
.missing h4 { margin: 0 0 6px; color: var(--accent); }

/* panel */
#panel { position: fixed; z-index: 30; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: 14px 16px 24px;
  right: 0; top: 0; bottom: 0; width: 400px; max-width: 100vw; }
@media (max-width: 760px) { #panel { top: auto; left: 0; width: auto; height: 72vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; } }
#panel[hidden] { display: none; }
#panel .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
#panel .x { border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--ink-3); padding: 2px 6px; }
#panel textarea, #panel input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); resize: vertical; }
#panel textarea { min-height: 76px; }
#panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 13px; color: var(--ink-2); }
#panel .sec { margin-top: 16px; }
#panel .sec > b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 6px; font-weight: 600; }
#panel .conn { display: flex; gap: 6px; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
#panel .conn span.t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel .unl { border: 0; background: transparent; color: var(--ink-3); font-size: 16px; padding: 0 4px; }
#panel select, #panel input[type=date] { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
#panel .sugbox { border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 10px; background: var(--accent-tint); }
#panel .sugbox .conn { border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
#panel .danger { color: var(--late); border-color: color-mix(in srgb, var(--late) 40%, transparent); }
#panel .story { margin-top: 10px; }

/* switcher */
#switcher { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--ink); color: var(--bg); overflow-x: auto; }
#switcher .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; white-space: nowrap; }
#switcher button { border: 1px solid transparent; background: transparent; color: var(--bg); border-radius: 8px; padding: 4px 10px; white-space: nowrap; opacity: .75; }
#switcher button[aria-pressed=true] { opacity: 1; border-color: color-mix(in srgb, var(--bg) 50%, transparent); }
#switcher button small { opacity: .65; margin-left: 4px; }
#switcher .sp { flex: 1; }
@media (max-width: 760px) { #switcher button small { display: none; } }

#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 280px; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
#tip[hidden] { display: none; }
#tip small { display: block; opacity: .7; margin-top: 2px; }
#toast { position: fixed; z-index: 50; pointer-events: none; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); }
#toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<aside id="panel" hidden></aside>
<nav id="switcher"></nav>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<script>
"use strict";
// ---------- time ----------
const DAY = 86400000;
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const T0 = startOfDay(Date.now());
const D = n => { const d = new Date(T0); d.setDate(d.getDate() + n); return d.getTime(); };
const dayIdx = ts => Math.round((startOfDay(ts) - T0) / DAY);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const md = ts => { const d = new Date(ts); return MON[d.getMonth()] + " " + d.getDate(); };
function fmtDay(ts) {
  const n = dayIdx(ts);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WD[new Date(ts).getDay()];
  return md(ts);
}
const toInput = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fromInput = v => { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };

// ---------- scenario ----------
// Six cases from docs/research/2026-11-08-data-shape-analysis.md, as entries and connections.
function seed() {
  const threads = [
    { id: "t:mum", name: "Mum's blood pressure", hue: 350 },
    { id: "t:sleep", name: "Sleep", hue: 245 },
    { id: "t:work", name: "Work stress", hue: 28 },
    { id: "t:teeth", name: "Teeth", hue: 188 },
    { id: "t:admin", name: "Admin & insurance", hue: 140 },
    { id: "t:home", name: "Home", hue: 70, rhythm: { text: "Water the plants", weekday: 0 } },
    { id: "t:car", name: "Replace the car", hue: 290, resolvedAt: D(-50) },
  ];
  const entries = [], links = [];
  const E = (id, text, at, o = {}) => {
    const eid = "e:" + id;
    entries.push({ id: eid, text, at: D(at), ask: o.ask != null ? D(o.ask) : null, doneAt: o.done != null ? D(o.done) : null });
    (o.on || []).forEach(t => links.push({ a: eid, b: "t:" + t }));
    (o.sugOn || []).forEach(t => links.push({ a: eid, b: "t:" + t, s: true }));
    (o.to || []).forEach(x => links.push({ a: eid, b: "e:" + x }));
    (o.sugTo || []).forEach(x => links.push({ a: eid, b: "e:" + x, s: true }));
  };
  // Case 3: a parent's blood pressure
  E("m1", "Mum's checkup: blood pressure 160/100. Doctor wants a cardiologist.", -95, { on: ["mum"] });
  E("m1b", "Book the cardiology appointment for Mum", -94, { ask: -88, done: -88, on: ["mum"] });
  E("m2", "Cardiology visit went fine. New medication, recheck in three months.", -67, { on: ["mum"] });
  E("m5", "Mum's cardiology follow-up", -67, { ask: 24, on: ["mum"] });
  E("m3", "Mum said she feels dizzy in the mornings.", -51, { sugOn: ["mum"] });
  E("m4", "Insurance rejected the cardiology claim. Appeal before the 15th.", -30, { ask: 7, on: ["admin", "mum"] });

const VARIANTS = {

// ---------- graph helpers ----------
const isT = id => id.startsWith("t:");
const other = (l, id) => l.a === id ? l.b : l.b === id ? l.a : null;
const linksOf = id => S.links.filter(l => l.a === id || l.b === id);

const threadsOf = (eid, sug = false) => linksOf(eid).filter(l => !!l.s === sug).map(l => other(l, eid)).filter(isT);
const entriesOf = (tid, sug = false) => linksOf(tid).filter(l => !!l.s === sug).map(l => byId(other(l, tid))).filter(Boolean);

const isOpenAsk = e => e.ask != null && e.doneAt == null;
const isLate = e => isOpenAsk(e) && dayIdx(e.ask) < 0;
const posTime = e => isOpenAsk(e) ? e.ask : (e.doneAt != null ? e.doneAt : e.at);
const nameOf = id => { const n = byId(id); return !n ? "?" : isT(id) ? n.name : n.text; };
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

// ---------- suggestions ----------
const STOP = new Set("the and for with that this from have has had was were are will just still some very really into over two one three about after before felt feel today tomorrow maybe need needs want should more again week weeks time first went than then them they she her his him our your you can could would told said says get got make made also back".split(" "));
const SYN = {};
Object.entries({
  back: "back spine posture chair sit sitting sat lower stiff",
  sleep: "sleep slept tired awake insomnia 4am night nights rest bed screens",
  work: "work launch workload manager deadline stress stressed calm office job",
  mum: "mum mom mother bp pressure dizzy dizziness cardiology cardiologist medication monitor",
  teeth: "teeth tooth dentist grinding guard jaw",
  admin: "insurance claim tax taxes bank appeal statement form",
  home: "plumber leak pipe sink plants house kitchen",
}).forEach(([k, words]) => words.split(" ").forEach(w => SYN[w] = "#" + k));
function toks(text) {
  const out = new Set();
  text.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).forEach(w => {
    if (SYN[w]) { out.add(SYN[w]); return; }
    if (w.length < 3 || STOP.has(w)) return;
    const st = w.length > 5 ? w.replace(/(ing|ed|es|s)$/, "") : w;
    out.add(SYN[st] || st);
  });
  return out;
}
const overlap = (a, b) => { let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return n; };
function suggest(e) {
  const tk = toks(e.text); if (!tk.size) return [];
  const scored = [];
  S.threads.filter(t => !t.resolvedAt).forEach(t => {
    const s = overlap(tk, toks(t.name + " " + entriesOf(t.id).map(x => x.text).join(" ")));
    if (s > 0) scored.push({ id: t.id, s: s + 0.5 });
  });
  S.entries.filter(x => x.id !== e.id && threadsOf(x.id).length === 0).forEach(x => {
    const s = overlap(tk, toks(x.text)); if (s > 0) scored.push({ id: x.id, s });
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, 3).map(x => x.id);
}

// ---------- mutations ----------
function addEntry(text, ask, pos) {
  const e = { id: "e:" + Date.now().toString(36), text, at: Date.now(), ask, doneAt: null };
  S.entries.push(e);
  const sugs = suggest(e);
  sugs.forEach(id => S.links.push({ a: e.id, b: id, s: true }));
  if (pos) S.pos[e.id] = { x: pos.x, y: pos.y, pinned: true };
  return { e, sugs };
}
function link(a, b) { const l = findLink(a, b); if (l) delete l.s; else S.links.push({ a, b }); }
function unlink(a, b) { S.links = S.links.filter(l => !((l.a === a && l.b === b) || (l.a === b && l.b === a))); }
function newThread(name) {
  const used = S.threads.map(t => t.hue);
  const hues = [210, 320, 100, 260, 10, 160, 50, 230];
  const t = { id: "t:" + Date.now().toString(36), name, hue: hues.find(x => !used.includes(x)) ?? Math.floor(Math.random() * 360) };
  S.threads.push(t); return t;
}
function looseCluster(eid) {
  const seen = new Set([eid]), q = [eid];
  while (q.length) {
    const cur = q.shift();
    entryNbrs(cur).forEach(n => { if (!seen.has(n) && threadsOf(n).length === 0) { seen.add(n); q.push(n); } });
  }
  return [...seen];
}

// ---------- Now (the Dashboard, from entries) ----------
function nowItems() {

// ---------- Lanes ----------
let laneScroll = null;
function laneOrder() {
  const open = S.threads.filter(t => !t.resolvedAt).sort((a, b) => lastActivity(b) - lastActivity(a));
  const shared = (a, b) => entriesOf(a.id).filter(e => threadsOf(e.id).includes(b.id)).length;
  const out = [];
  while (open.length) {
    if (!out.length) { out.push(open.shift()); continue; }
    let bi = 0, bs = -1;
    open.forEach((t, i) => { const s = out.reduce((acc, p, j) => acc + shared(t, p) / (out.length - j), 0); if (s > bs) { bs = s; bi = i; } });
    out.push(open.splice(bi, 1)[0]);
  }
  return out.concat(S.threads.filter(t => t.resolvedAt));
}
function renderLanes(m) {
  const lanes = laneOrder();
  const LANE = 78, TOP = 34;
  const laneY = {}; lanes.forEach((t, i) => laneY[t.id] = TOP + i * LANE + LANE / 2);
  const looseTop = TOP + lanes.length * LANE;
  const allTs = S.entries.map(posTime).concat(S.entries.map(e => e.at));
  const minTs = D(Math.min(-30, ...allTs.map(dayIdx)) - 8);
  const maxTs = D(Math.max(40, ...allTs.map(dayIdx)) + 12);
  const avail = (m.clientWidth || innerWidth) - (innerWidth <= 640 ? 112 : 170) - 4;
  const PX = Math.max(7, avail / ((maxTs - minTs) / DAY));
  const x = ts => (ts - minTs) / DAY * PX;
  const W = Math.round(x(maxTs));
  const loose = S.entries.filter(e => threadsOf(e.id).length === 0).sort((a, b) => posTime(a) - posTime(b));
  const rows = [looseTop + 26, looseTop + 58, looseTop + 90], rowEnd = [-1e9, -1e9, -1e9];
  const looseY = {};
  loose.forEach(e => {
    const px = x(posTime(e));
    let r = rowEnd.findIndex(end => end < px - 8);
    if (r < 0) r = rowEnd.indexOf(Math.min(...rowEnd));
    looseY[e.id] = rows[r]; rowEnd[r] = px + Math.min(150, trunc(e.text, 24).length * 6);
  });
  const H = looseTop + 118;
  const pts = e => { const ts = threadsOf(e.id).filter(t => laneY[t] != null); return ts.length ? ts.map(t => ({ t, y: laneY[t] })) : [{ t: null, y: looseY[e.id] }]; };

  // selection: what to keep bright

  if (sel && byId(sel)) {
    bright = new Set([sel]);
    linksOf(sel).forEach(l => bright.add(other(l, sel)));
    if (!isT(sel)) threadsOf(sel).forEach(t => bright.add(t));
  }
  const dim = id => bright && !bright.has(id) ? " dim" : "";

  let g = "";
  lanes.forEach((t, i) => { if (i % 2 === 0) g += `<rect class="stripe" x="0" y="${TOP + i * LANE}" width="${W}" height="${LANE}"/>`; });
  // month grid
  const d0 = new Date(minTs); d0.setDate(1); d0.setMonth(d0.getMonth() + 1);
  for (let d = new Date(d0); d.getTime() < maxTs; d.setMonth(d.getMonth() + 1)) {

    g += `<line class="grid" x1="${xx}" x2="${xx}" y1="${TOP - 10}" y2="${H}"/><text class="ax" x="${xx + 5}" y="${TOP - 14}">${MON[d.getMonth()]}</text>`;
  }

    <h2>${h(t.name)}</h2>
    <h4>Tasks</h4>${b.tasks.length ? `<ul>${b.tasks.map(e => `<li>${h(e.text)} <small>${fmtDay(e.ask)}</small></li>`).join("")}</ul>` : `<p class="sub" style="color:var(--ink-3)">No tasks.</p>`}
    ${t.rhythm ? `<ul><li>↻ ${h(t.rhythm.text)} <small>every ${WD[t.rhythm.weekday]}</small></li></ul>` : ""}
    <h4>Notes</h4>${b.notes.length ? `<ul>${[...b.notes].sort((x, y) => y.at - x.at).map(e => `<li>${h(e.text)} <small>${md(e.at)}</small></li>`).join("")}</ul>` : `<p style="color:var(--ink-3)">No notes.</p>`}
    <h4>Activity</h4><ul>${b.activity.map(e => `<li>Completed "${h(e.text)}" <small>${md(e.doneAt)}</small></li>`).join("")}${t.resolvedAt ? `<li>Resolved <small>${md(t.resolvedAt)}</small></li>` : ""}<li>Started <small>${md(Math.min(...[...b.notes, ...b.tasks, ...b.activity].map(e => e.at), T0))}</small></li></ul>
    ${missing.length ? `<div class="missing"><h4>Not visible from this thread today</h4><ul>${missing.map(x => `<li>${h(x.e.text)} <small>lives in ${h(x.where)}</small></li>`).join("")}</ul></div>` : ""}
  </div></div>`;
}

// ---------- Panel ----------
function renderPanel() {
  const p = $("panel");
  if (!sel || !byId(sel) || variant === "current") { p.hidden = true; document.body.classList.remove("panel-open"); return; }
  p.hidden = false;
  if (innerWidth > 760) { p.style.top = $("top").offsetHeight + "px"; p.style.bottom = $("switcher").offsetHeight + "px"; }
  else { p.style.top = ""; p.style.bottom = $("switcher").offsetHeight + "px"; }
  if (isT(sel)) {
    const t = byId(sel);
    p.innerHTML = `<div class="ph">Thread<button class="x" data-act="close" aria-label="Close">×</button></div>
      <input type="text" data-act="tname" value="${h(t.name)}">
      <div class="row">${t.resolvedAt ? `Resolved ${md(t.resolvedAt)} <button class="btn small" data-act="reopen">Reopen</button>` : `Open <button class="btn small" data-act="resolve">Resolve</button>`}
      ${t.rhythm ? ` · ↻ ${h(t.rhythm.text)}, every ${WD[t.rhythm.weekday]}` : ""}</div>
      ${storyHtml(sel)}`;
    return;
  }
  const e = byId(sel);
  const acc = threadsOf(e.id), sgT = threadsOf(e.id, true), accE = entryNbrs(e.id), sgE = entryNbrs(e.id, true);
  const loose = !acc.length;
  const cluster = loose ? looseCluster(e.id) : [];
  p.innerHTML = `<div class="ph">Entry · ${md(e.at)}<button class="x" data-act="close" aria-label="Close">×</button></div>
    <textarea data-act="text">${h(e.text)}</textarea>
    <div class="row">${isOpenAsk(e)
      ? `Comes back <input type="date" data-act="ask" value="${toInput(e.ask)}"> <button class="btn small" data-act="handle">Handled</button> <button class="btn small ghost" data-act="clearAsk">No date</button>`
      : e.doneAt ? `Handled ${md(e.doneAt)}, kept as a record <button class="btn small ghost" data-act="unhandle">Undo</button>`
      : `Bring back on <input type="date" data-act="ask" value="">`}</div>
    ${sgT.length || sgE.length ? `<div class="sec"><b>Suggested</b><div class="sugbox">
      ${sgT.concat(sgE).map(id => `<div class="conn"><span class="t">${isT(id) ? chip(id, true) : h(trunc(nameOf(id), 46))}</span><span><button class="btn small" data-accept="${e.id}|${id}">Accept</button> <button class="btn small ghost" data-dismiss="${e.id}|${id}">Dismiss</button></span></div>`).join("")}
    </div></div>` : ""}
    <div class="sec"><b>On threads</b>
      ${acc.map(t => `<div class="conn"><span class="t">${chip(t)}</span><button class="unl" data-unlink="${e.id}|${t}" title="Take off this thread">×</button></div>`).join("") || `<p style="margin:0 0 6px;color:var(--ink-3)">Loose. That's fine.</p>`}
      <select data-act="addThread"><option value="">+ Put on a thread…</option>${S.threads.filter(t => !acc.includes(t.id)).map(t => `<option value="${t.id}">${h(t.name)}</option>`).join("")}<option value="__new">New thread…</option></select>
    </div>
    <div class="sec"><b>Connected entries</b>
      ${accE.map(id => `<div class="conn"><span class="t" data-open="${id}" style="cursor:pointer">${h(trunc(nameOf(id), 50))}</span><button class="unl" data-unlink="${e.id}|${id}" title="Disconnect">×</button></div>`).join("") || `<p style="margin:0 0 6px;color:var(--ink-3)">None.</p>`}
      <select data-act="addLink"><option value="">+ Connect to an entry…</option>${[...S.entries].filter(x => x.id !== e.id && !accE.includes(x.id)).sort((a, b) => b.at - a.at).map(x => `<option value="${x.id}">${h(trunc(x.text, 60))}</option>`).join("")}</select>
    </div>
    ${loose ? `<div class="sec"><button class="btn primary" data-act="startThread">Start a thread${cluster.length > 1 ? ` with these ${cluster.length}` : ""}</button>
      <p style="color:var(--ink-3);font-size:12px;margin:6px 0 0">${cluster.length > 1 ? "Takes this entry and the loose entries connected to it. Nothing is converted; they just go on the new line." : "Names a new line with this entry on it. Connect related loose entries first to bring them along."}</p></div>` : ""}
    <div class="sec"><button class="btn small danger" data-act="delete">Delete entry</button></div>`;
}

// ---------- switcher, tip, toast ----------
function renderSwitcher() {
  $("switcher").innerHTML = `<span class="lab">Variant</span>${VK.map((k, i) => `<button data-variant="${k}" aria-pressed="${variant === k}">${i + 1} ${k}<small>${VARIANTS[k]}</small></button>`).join("")}<span class="sp"></span><button data-act="reset" title="Restore the scenario">Reset</button>`;
}
function showTip(text, ev) {
  const t = $("tip");
  if (!text) { t.hidden = true; return; }
  const [a, b] = text.split("|");
  t.innerHTML = h(a) + (b ? `<small>${h(b)}</small>` : "");
  t.hidden = false;
  const x = Math.min(ev.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - t.offsetHeight - 60);
  t.style.left = x + "px"; t.style.top = y + "px";
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---------- events ----------
document.addEventListener("mousemove", ev => {
  if (ev.target.closest && ev.target.closest("#cv")) return;
  const el = ev.target.closest && ev.target.closest("[data-tip]");
  showTip(el ? el.getAttribute("data-tip") : null, ev);
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "capture") return;
  ev.preventDefault();
  const text = $("cap-text").value.trim(); if (!text) return;
  const { e, sugs } = addEntry(text, fromInput($("cap-date").value));
  $("cap-text").value = "";
  sel = e.id;
  toast(sugs.length ? `Dropped at now. ${sugs.length} suggested connection${sugs.length > 1 ? "s" : ""}.` : "Dropped at now. Loose, no suggestions.");
  render();
});
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act],[data-done],[data-accept],[data-dismiss],[data-unlink],[data-variant],[data-tab],[data-cthread],[data-focus],[data-open]");
  if (!el || el.closest("#cv")) return;
  const d = el.dataset;
  if (d.variant) { variant = d.variant; sel = null; laneScroll = null; setUrl(); return render(); }
  if (d.tab) { tab = d.tab; setUrl(); return render(); }
  if (d.cthread) { curThread = d.cthread; return renderMain(); }
  if (d.focus) { focusId = d.focus; sel = d.focus; return render(); }
  if (d.done) { const e = byId(d.done); e.doneAt = T0; toast("Handled. It stays on its threads as a record."); return render(); }
  if (d.accept) { const [a, b] = d.accept.split("|"); link(a, b); return render(); }
  if (d.dismiss) { const [a, b] = d.dismiss.split("|"); unlink(a, b); return render(); }
  if (d.unlink) { const [a, b] = d.unlink.split("|"); unlink(a, b); return render(); }
  if (d.act) {
    const e = sel && byId(sel);
    switch (d.act) {
      case "close": sel = null; return render();
      case "reset": if (confirm("Restore the original scenario? Your changes in the prototype are lost.")) { S = seed(); sel = null; view.fitted = false; laneScroll = null; render(); } return;
      case "arrange": Object.values(S.pos).forEach(p => p.pinned = false); runSim(220, true); return;
      case "fit": fitView($("cv")); drawCanvas(); return;
      case "handle": e.doneAt = T0; return render();
      case "unhandle": e.doneAt = null; return render();
      case "clearAsk": e.ask = null; e.doneAt = null; return render();
      case "resolve": e.resolvedAt = T0; return render();
      case "reopen": delete e.resolvedAt; return render();
      case "delete": if (confirm("Delete this entry?")) { S.entries = S.entries.filter(x => x.id !== sel); S.links = S.links.filter(l => l.a !== sel && l.b !== sel); delete S.pos[sel]; sel = null; render(); } return;
      case "startThread": {
        const ids = looseCluster(sel);
        const name = prompt("Name the thread", ""); if (!name || !name.trim()) return;
        const t = newThread(name.trim());
        ids.forEach(id => link(id, t.id));
        if (S.pos[sel]) S.pos[t.id] = { x: S.pos[sel].x, y: S.pos[sel].y - 90 };
        sel = t.id; focusId = t.id; toast(`"${t.name}" started with ${ids.length} entr${ids.length > 1 ? "ies" : "y"}`);
        return render();
      }
    }
    return;
  }
  if (d.open) { sel = d.open; if (variant === "focus") focusId = d.open; return render(); }
});
document.addEventListener("change", ev => {
  const el = ev.target, act = el.dataset && el.dataset.act; if (!act || !sel) return;
  const e = byId(sel);
  if (act === "ask") { e.ask = fromInput(el.value); e.doneAt = null; return render(); }
  if (act === "addThread" && el.value) {
    let tid = el.value;
    if (tid === "__new") { const name = prompt("Name the thread"); if (!name || !name.trim()) return render(); tid = newThread(name.trim()).id; }
    link(sel, tid); return render();
  }
  if (act === "addLink" && el.value) { link(sel, el.value); return render(); }
});
document.addEventListener("input", ev => {
  const el = ev.target, act = el.dataset && el.dataset.act; if (!sel) return;
  if (act === "text") { byId(sel).text = el.value; renderMain(); save(); }
  if (act === "tname") { byId(sel).name = el.value; renderMain(); save(); }
});
document.addEventListener("keydown", ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (ev.key === "Escape") { if (typing) document.activeElement.blur(); sel = null; return render(); }
  if (typing) return;
  if (ev.key === "[" || ev.key === "]") { const i = VK.indexOf(variant); variant = VK[(i + (ev.key === "]" ? 1 : VK.length - 1)) % VK.length]; sel = null; laneScroll = null; setUrl(); render(); }
  if (/^[1-4]$/.test(ev.key)) { variant = VK[+ev.key - 1]; sel = null; laneScroll = null; setUrl(); render(); }
  if (ev.key === "Enter" && document.activeElement.dataset && document.activeElement.dataset.open) document.activeElement.click();
});
addEventListener("resize", () => { if (variant === "canvas" && tab === "map") { fitView($("cv")); drawCanvas(); } });

render();
</script>
</body>
</html>
